name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate Cloudflare Worker bundle (dry run, no deploy)
        run: npx wrangler deploy --config .output/server/wrangler.json --dry-run

      - name: Validate phase-gated analytics service Python syntax
        run: python3 -m compileall -q analytics-service/app

      - name: Validate phase-gated analytics migration is present
        run: test -s supabase/migrations/20260921150000_analytics_phase1_foundation.sql
